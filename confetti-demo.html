<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>礼花动效 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .demo-wrapper { text-align: center; }
  button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 48px;
    padding: 0 24px;
    border: none;
    border-radius: 12px;
    background: #202224;
    color: white;
    font-size: 16px;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
  }
  button:hover { background: #404244; }

  .confetti-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9999;
  }
  .confetti-particle {
    position: absolute;
    animation: confetti-burst 0.9s ease-out forwards;
  }
  @keyframes confetti-burst {
    0%   { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    20%  { opacity: 1; transform: translate(calc(var(--dx) * 0.3), calc(var(--dy) * 0.3)) rotate(calc(var(--r) * 0.3)) scale(1.3); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(0.2); }
  }
</style>
</head>
<body>
<div class="demo-wrapper">
  <p style="margin-bottom: 24px; color: #888; font-size: 14px;">点击按钮查看优化后的礼花动效</p>
  <button id="btn" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
    复制 SVG
  </button>
</div>

<script>
  const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9']

  function fireConfetti(e) {
    const cx = e.clientX
    const cy = e.clientY

    const container = document.createElement('div')
    container.className = 'confetti-container'
    document.body.appendChild(container)

    // 粒子分布：中心区域密集（近距离），外围稀疏（远距离）
    const layers = [
      { count: 12, minDist: 30,  maxDist: 80  },
      { count: 8,  minDist: 80,  maxDist: 150 },
      { count: 5,  minDist: 150, maxDist: 220 },
    ]

    layers.forEach(({ count, minDist, maxDist }) => {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div')
        const shape = Math.random()
        const isStripe = shape > 0.7 // 30% 概率为条状
        const isCircle = shape < 0.35 // 35% 圆
        // 剩下 35% 方块

        el.className = 'confetti-particle'

        const angle = Math.random() * Math.PI * 2
        const distance = minDist + Math.random() * (maxDist - minDist)
        const dx = Math.cos(angle) * distance
        const dy = Math.sin(angle) * distance + 50 // 向下重力

        let w, h, br
        if (isStripe) {
          w = 2 + Math.random() * 2
          h = 8 + Math.random() * 6
          br = '1px'
          el.style.background = `linear-gradient(180deg, ${colors[Math.floor(Math.random() * colors.length)]}, ${colors[Math.floor(Math.random() * colors.length)]})`
        } else if (isCircle) {
          w = 5 + Math.random() * 3
          h = w
          br = '50%'
          el.style.background = colors[Math.floor(Math.random() * colors.length)]
        } else {
          w = 4 + Math.random() * 4
          h = 4 + Math.random() * 4
          br = '1px'
          el.style.background = colors[Math.floor(Math.random() * colors.length)]
        }

        el.style.cssText += `
          left: ${cx}px;
          top: ${cy}px;
          width: ${w}px;
          height: ${h}px;
          border-radius: ${br};
          --dx: ${dx}px;
          --dy: ${dy}px;
          --r: ${Math.random() * 720}deg;
          animation-duration: ${0.6 + Math.random() * 0.5}s;
          animation-delay: ${Math.random() * 0.06}s;
        `
        container.appendChild(el)
      }
    })

    setTimeout(() => container.remove(), 1500)
  }

  document.getElementById('btn').addEventListener('click', function(e) {
    fireConfetti(e)
  })
</script>
</body>
</html>
